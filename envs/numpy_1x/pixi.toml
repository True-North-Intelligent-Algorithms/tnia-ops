[workspace]
name = "tnia-numpy-1x"
description = "tnia-python with NumPy 1, for packages not yet ported to NumPy 2."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
numpy = "<2"  # raster-geometry 0.1.4.2 still uses np.float_
scipy = "*"
scikit-image = "*"
matplotlib = "*"
imageio = "*"

[pypi-dependencies]
tnia-python = ">=0.2.3"  # random_circles with float radii
raster-geometry = "*"  # tnia.simulation.phantoms imports it
# The runner's worker side, as scikit-ops' own environments have it.
scikit-ops = { git = "https://github.com/apposed/scikit-ops.git", rev = "00925fea3d92f3c974b7b1ec67d6633307d27bcc" }
