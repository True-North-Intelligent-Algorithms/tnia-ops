[workspace]
name = "tnia-cupy"
description = "tnia-python on an NVIDIA GPU, with cupy."
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
numpy = "*"
cupy = "*"
cuda-version = "12.2"

[pypi-dependencies]
tnia-python = ">=0.2.2"
# The collection itself, at this release's version, and the runner's worker
# side. Bump the tnia-ops pin with pyproject.toml's version.
tnia-ops = "==0.1.0.dev0"
oprunner = ">=0.1.0.dev0"
