[workspace]
name = "tnia-cupy"
description = "tnia-python on an NVIDIA GPU, with cupy."
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
numpy = "*"
cupy = "*"
cuda-version = "12.2"

[pypi-dependencies]
tnia-python = ">=0.2.2"
# The runner's worker side, as scikit-ops' own environments have it.
scikit-ops = { git = "https://github.com/apposed/scikit-ops.git", rev = "00925fea3d92f3c974b7b1ec67d6633307d27bcc" }
