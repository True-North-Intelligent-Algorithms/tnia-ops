[workspace]
name = "tnia-photo"
description = "Photo clean-up: OpenCV, plus PyTorch for people detection, OCR, deblurring and upscaling."
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"

# One environment for every photo op, the light OpenCV ones included: the
# torch install dominates, and a photo pipeline calls both kinds in a row, so
# sharing one warm worker beats a second environment for the cheap ones.

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
numpy = "*"
opencv = "*"
ultralytics = ">=8.3"
# conda's ultralytics reads torchvision's version at import; see scikit-ops'
# envs/pytorch for the story.
torchvision = "*"

[pypi-dependencies]
easyocr = "*"
spandrel = "*"
spandrel_extra_arches = "*"  # Restormer
# The collection itself, at this release's version, and the runner's worker
# side. Bump the tnia-ops pin with pyproject.toml's version.
tnia-ops = "==0.1.0.dev0"
oprunner = ">=0.1.0.dev0"

[target.linux-64.dependencies]
pytorch-gpu = "*"
cuda-version = "12.2"

[target.win-64.dependencies]
pytorch-gpu = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
