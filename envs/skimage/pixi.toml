[workspace]
name = "tnia-skimage"
description = "tnia-python on the CPU, with scikit-image."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
numpy = ">=2"
scipy = "*"
scikit-image = "*"
matplotlib = "*"  # tnia.background.rolling_ball imports it
imageio = "*"
tqdm = "*"  # tnia.morphology.connect imports it

[pypi-dependencies]
tnia-python = ">=0.2.2"
# The collection itself, at this release's version, and the runner's worker
# side. Bump the tnia-ops pin with pyproject.toml's version.
tnia-ops = "==0.1.0.dev0"
oprunner = ">=0.1.0.dev0"
