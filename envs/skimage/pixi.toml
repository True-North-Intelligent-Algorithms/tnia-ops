[workspace]
name = "tnia-skimage"
description = "tnia-python on the CPU, with scikit-image."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
numpy = ">=2"
scipy = "*"
scikit-image = "*"
matplotlib = "*"  # tnia.background.rolling_ball imports it
imageio = "*"
tqdm = "*"  # tnia.morphology.connect imports it

[pypi-dependencies]
tnia-python = ">=0.2.2"
# The runner's worker side, as scikit-ops' own environments have it.
scikit-ops = { git = "https://github.com/apposed/scikit-ops.git", rev = "00925fea3d92f3c974b7b1ec67d6633307d27bcc" }
