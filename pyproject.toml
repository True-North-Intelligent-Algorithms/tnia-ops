[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tnia-ops"
version = "0.0.1"
description = "tnia-python's utilities, as ops"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brian Northan", email = "bnorthan@gmail.com" }]
requires-python = ">=3.10"
# Only what declaring the ops needs. tnia-python and its dependencies live
# in the op environments, under envs/.
dependencies = ["opspec", "ophelper", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/tnia_ops"]

[dependency-groups]
dev = ["pytest"]
# What examples/ needs: a runner (oprunner), scikit-ops' ops, and Jupyter.
examples = ["oprunner", "scikit-ops", "ipykernel", "matplotlib", "nbconvert"]

[tool.uv.sources]
# The sibling checkout while opspec is unreleased.
opspec = { path = "../scikit-ops/opspec", editable = true }
ophelper = { path = "../scikit-ops/ophelper", editable = true }
oprunner = { path = "../scikit-ops/oprunner", editable = true }
scikit-ops = { path = "../scikit-ops", editable = true }

[tool.uv]
# A bare `uv sync` keeps the examples' kernel instead of stripping it.
default-groups = ["dev", "examples"]
